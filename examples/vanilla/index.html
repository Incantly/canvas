<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incantly Canvas — vanilla example</title>
  <link rel="stylesheet" href="../../packages/core/src/canvas.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    .theme-toggle {
      position: fixed; top: 10px; right: 10px; z-index: 50;
      font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="board"></div>
  <button class="theme-toggle" id="theme">dark</button>
  <script type="module">
    // In your own project:  import { createCanvas } from '@incantly/canvas'
    import { createCanvas } from '../../packages/core/src/index.js'

    const board = createCanvas({
      container: document.getElementById('board'),
      theme: 'light',
      grid: 'lines',
    })

    document.getElementById('theme').addEventListener('click', () => {
      const next = board.editor.theme.id === 'light' ? 'dark' : 'light'
      board.editor.setTheme(next)
      document.getElementById('theme').textContent = next === 'light' ? 'dark' : 'light'
    })
  </script>
</body>
</html>
