<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Incantly Canvas — free online whiteboard</title>
  <meta name="description" content="A free online whiteboard. Draw with pressure ink, shapes, sticky notes, and arrows on an infinite canvas. No account, autosaved in your browser, exports to PNG. Open source." />
  <link rel="canonical" href="https://github.com/Incantly/canvas" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Incantly Canvas — free online whiteboard" />
  <meta property="og:description" content="Draw instantly. No account, autosaved locally, open source." />
  <meta property="og:image" content="https://github.com/Incantly/canvas/raw/main/docs/star-history.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#faf8f4" />
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    #board { position: fixed; inset: 0; }
    /* Top-left chrome — the wordmark and the file bar follow the board's
       theme, same glass recipe as the dock: light glass on light paper,
       dark glass on dark. The 320ms transitions match the board's own
       theme crossfade so the whole switch reads as one motion. */
    :root {
      --bar-bg: rgba(255, 255, 255, 0.88);
      --bar-border: rgba(28, 27, 24, 0.12);
      --bar-shadow: 0 4px 16px rgba(28, 27, 24, 0.14);
      --bar-ink: rgba(28, 27, 24, 0.9);
      --bar-hover: rgba(28, 27, 24, 0.07);
      --menu-bg: rgba(255, 255, 255, 0.94);
      --menu-shadow: 0 8px 28px rgba(28, 27, 24, 0.2);
      --del-ink: rgba(28, 27, 24, 0.4);
      --del-hot: #c0392b;
      --del-hot-bg: rgba(192, 57, 43, 0.1);
      --current-dot: #2f6fed;
    }
    :root.dark {
      --bar-bg: rgba(19, 17, 13, 0.72);
      --bar-border: rgba(255, 255, 255, 0.14);
      --bar-shadow: 0 4px 16px rgba(10, 8, 4, 0.25);
      --bar-ink: rgba(255, 255, 255, 0.9);
      --bar-hover: rgba(255, 255, 255, 0.1);
      --menu-bg: rgba(19, 17, 13, 0.85);
      --menu-shadow: 0 8px 28px rgba(10, 8, 4, 0.35);
      --del-ink: rgba(255, 255, 255, 0.45);
      --del-hot: #ff7b6b;
      --del-hot-bg: rgba(255, 123, 107, 0.14);
      --current-dot: #6285f5;
    }
    .ic-app-logo {
      position: fixed; left: 10px; top: 10px; z-index: 60;
      display: flex; align-items: center; gap: 8px;
      font: 700 15.5px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -0.01em;
      color: var(--bar-ink); text-decoration: none;
      padding: 8px 14px 8px 11px; border-radius: 999px;
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      box-shadow: var(--bar-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
      transition: background 320ms ease, color 320ms ease, border-color 320ms ease, box-shadow 320ms ease;
    }
    .ic-app-logo svg { width: 20px; height: 20px; display: block; }
    .ic-app-logo:hover { background: var(--bar-hover); }

    /* File bar — files menu, new file, and the current file's name. */
    .ic-filebar {
      position: fixed; left: 152px; top: 10px; z-index: 60;
      display: flex; align-items: center; gap: 2px;
      padding: 4px 6px; border-radius: 999px;
      font: 500 14px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--bar-ink);
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      box-shadow: var(--bar-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 320ms ease, color 320ms ease, border-color 320ms ease, box-shadow 320ms ease;
    }
    .ic-file-btn {
      appearance: none; border: none; background: transparent; color: inherit;
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 140ms ease;
    }
    .ic-file-btn svg { width: 17px; height: 17px; display: block; }
    .ic-file-btn:hover { background: var(--bar-hover); }
    .ic-file-name {
      appearance: none; border: none; background: transparent; color: inherit;
      font: inherit; font-weight: 600; letter-spacing: -0.005em;
      margin-left: 2px; padding: 7px 10px; border-radius: 999px;
      min-width: 40px; max-width: 200px; cursor: text;
      transition: background 140ms ease;
    }
    .ic-file-name:hover { background: var(--bar-hover); }
    .ic-file-name:focus { outline: none; background: var(--bar-hover); }
    .ic-files-menu {
      position: fixed; left: 156px; top: 54px; z-index: 70;
      min-width: 230px; max-height: 60vh; overflow-y: auto;
      background: var(--menu-bg); color: var(--bar-ink);
      border: 1px solid var(--bar-border); border-radius: 13px;
      box-shadow: var(--menu-shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      transition: background 320ms ease, color 320ms ease, border-color 320ms ease, box-shadow 320ms ease;
    }
    .ic-files-menu[hidden] { display: none; }
    .ic-files-menu .ic-file-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      font: 500 14px/1.2 inherit;
    }
    .ic-file-row:hover { background: var(--bar-hover); }
    .ic-file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ic-file-row.current .name { font-weight: 700; }
    .ic-file-row .dot { width: 6px; height: 6px; border-radius: 999px; background: transparent; flex: none; }
    .ic-file-row.current .dot { background: var(--current-dot); }
    .ic-file-row .del {
      appearance: none; border: none; background: transparent; cursor: pointer;
      color: var(--del-ink); border-radius: 6px; flex: none;
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      font: 600 14px/1 inherit; padding: 0;
    }
    .ic-file-row .del:hover { color: var(--del-hot); background: var(--del-hot-bg); }

    @media (max-width: 560px) {
      /* the wordmark folds to its glyph so the file bar fits beside it */
      .ic-app-logo { padding: 8px 11px; }
      .ic-app-logo .logo-word { display: none; }
      .ic-filebar { left: 60px; }
      .ic-file-name { max-width: 110px; }
      .ic-files-menu { left: 14px; }
    }
  </style>
</head>
<body>
  <div id="board"></div>
  <a class="ic-app-logo" id="logo" href="https://github.com/Incantly/canvas" rel="noopener" aria-label="Incantly Canvas home">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M7 21 C7 12, 13 6.5, 20 7.5 C26.5 8.5, 27.5 16, 22 18.8 C17.5 21, 13 19.5, 14 15" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="24.5" cy="24.5" r="2.6" fill="#2f6fed"/>
    </svg>
    <span class="logo-word">Incantly</span>
  </a>
  <div class="ic-filebar" id="filebar">
    <button class="ic-file-btn" id="files-btn" type="button" title="Your files" aria-label="Your files" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 5.5 A1.8 1.8 0 0 1 4.3 3.7 H7.4 L9.2 5.6 H15.7 A1.8 1.8 0 0 1 17.5 7.4 V14.5 A1.8 1.8 0 0 1 15.7 16.3 H4.3 A1.8 1.8 0 0 1 2.5 14.5 Z"/>
      </svg>
    </button>
    <button class="ic-file-btn" id="new-file-btn" type="button" title="New file" aria-label="New file">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <path d="M10 4.5 V15.5 M4.5 10 H15.5"/>
      </svg>
    </button>
    <input class="ic-file-name" id="file-name" type="text" value="Untitled" spellcheck="false" autocomplete="off" aria-label="File name" />
  </div>
  <div class="ic-files-menu" id="files-menu" hidden role="menu" aria-label="Files"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
