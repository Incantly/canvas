name: Release

# Publishes all three packages to npm when a version tag is pushed.
# Requires an npm automation token in the NPM_TOKEN repo secret
# (npmjs.com → Access Tokens → Generate → Automation).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      # Skipped (not failed) when the NPM_TOKEN secret isn't configured yet.
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --workspace=@incantly/canvas --provenance --access public
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --workspace=@incantly/canvas-react --provenance --access public
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --workspace=@incantly/canvas-react-native --provenance --access public
